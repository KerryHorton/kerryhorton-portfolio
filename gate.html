<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Private portfolio — Kerry Horton</title>
<link rel="icon" type="image/png" href="/assets/logo-k.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:#F3EFE8;color:#211A1B;font-family:'Hanken Grotesk',system-ui,sans-serif}
  .gate{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}
  .circle{position:absolute;border-radius:50%;background:#F7CFDD;width:min(60vw,640px);height:min(60vw,640px);top:-18%;right:-12%}
  .dot{position:absolute;border-radius:50%;background:#fa8072;width:26px;height:26px;bottom:12%;left:10%}
  .inner{position:relative;width:100%;max-width:480px;text-align:center}
  .brand{font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1;margin-bottom:34px}
  .eyebrow{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6F6660}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-.015em;margin:14px 0 0}
  h1 em{font-style:italic;color:#fa8072}
  .desc{font-size:16px;line-height:1.6;color:#6F6660;margin:18px auto 30px;max-width:38ch}
  form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  input{font:15px 'Hanken Grotesk',sans-serif;padding:15px 20px;border:1px solid rgba(33,26,27,.3);border-radius:100px;background:#F3EFE8;color:#211A1B;min-width:220px;outline:none}
  input:focus{border-color:#fa8072;box-shadow:0 0 0 3px rgba(250,128,114,.2)}
  button{font:12.5px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:15px 26px;border:0;border-radius:100px;background:#211A1B;color:#F3EFE8;cursor:pointer;transition:background .25s,opacity .25s}
  button:hover{background:#fa8072}
  button:disabled{cursor:wait;opacity:.65}
  .arr{display:inline-block;transition:transform .3s ease}
  button:hover .arr{transform:translateX(4px)}
  .error{color:#5E1B33;font-size:13.5px;margin-top:18px;min-height:20px}
  .request{position:relative;display:inline-block;margin-top:26px;font:11.5px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#6F6660;text-decoration:none;padding-bottom:7px;transition:color .25s}
  .request:hover{color:#6e1f3a}
  :focus-visible{outline:2px solid #b8442f;outline-offset:3px}
</style>
</head>
<body>
<main class="gate">
  <span class="circle" aria-hidden="true"></span>
  <span class="dot" aria-hidden="true"></span>
  <div class="inner">
    <div class="brand">Kerry Horton</div>
    <div class="eyebrow">Private portfolio</div>
    <h1><em>Password</em>, please.</h1>
    <p class="desc">This portfolio includes confidential research work. Enter the password to explore, or reach out and I’ll share it!</p>
    <form id="gate-form">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus />
      <button type="submit">Enter <span class="arr">→</span></button>
    </form>
    <div id="gate-error" class="error" role="alert" aria-live="polite"></div>
    <a class="request" href="mailto:kerryhorton3@gmail.com?subject=Portfolio%20access">Request access →</a>
  </div>
</main>
<script type="module" src="vercel-observability.js"></script>
<script src="kerry-gate.js"></script>
</body>
</html>
