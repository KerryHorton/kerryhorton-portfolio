<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  #root { width: 100vw; height: 100vh; }
  /* unobtrusive usage hint */
  .wf-hint {
    position: fixed; left: 16px; bottom: 14px; z-index: 50; pointer-events: none;
    font: 500 11px/1.5 "DM Mono", ui-monospace, monospace; color: rgba(40,30,20,.55);
    letter-spacing: .3px;
  }
  .wf-hint b { color: rgba(40,30,20,.8); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<div class="wf-hint">drag / scroll to pan · pinch or ⌘-scroll to zoom · click <b>⤢</b> to focus a screen</div>
